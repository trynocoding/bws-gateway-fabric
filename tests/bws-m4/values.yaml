# M4.3 uses only the BWS Helm and custom-resource API contracts.
bwsGateway:
  name: bws-gateway-fabric
  watchNamespaces:
    - bws-m4
  gatewayClassName: bws
  gatewayControllerName: gateway.bessystem.com/bws-gateway-controller
  leaderElection:
    enable: true
    lockName: bws-gateway-leader-election
  productTelemetry:
    enable: false
  gwAPIExperimentalFeatures:
    enable: true
  snippets:
    enable: true
  image:
    repository: bws-gateway-fabric
    tag: m4-local
    pullPolicy: Never

bws:
  replicas: 2
  autoscaling:
    enable: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 30
    targetMemoryUtilizationPercentage: 90
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  image:
    repository: bws-gateway-fabric/bws
    tag: m4-local
    pullPolicy: Never
  service:
    type: ClusterIP
  pod:
    terminationGracePeriodSeconds: 30
    volumes:
      - name: bws-license
        secret:
          secretName: bws-license
          items:
            - key: bws.lic.txt
              path: bws.lic.txt
  container:
    resources:
      requests:
        cpu: 20m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    lifecycle:
      preStop:
        exec:
          command:
            - /usr/bin/sleep
            - "5"
    readinessProbe:
      port: 8081
      path: /readyz
      initialDelaySeconds: 3
    volumeMounts:
      - name: bws-license
        mountPath: /var/run/secrets/bws
        readOnly: true
