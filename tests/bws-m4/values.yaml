# M4.1 keeps the upstream Helm top-level fields and custom resources while switching visible product identity.
nginxGateway:
  name: bws-gateway-fabric
  watchNamespaces:
    - bws-m4
  gatewayClassName: bws
  gatewayControllerName: gateway.bessystem.com/bws-gateway-controller
  leaderElection:
    enable: true
    lockName: bws-gateway-leader-election
  productTelemetry:
    enable: false
  snippets:
    enable: true
  image:
    repository: bws-gateway-fabric
    tag: m4-local
    pullPolicy: Never

nginx:
  plus: false
  replicas: 2
  image:
    repository: bws-gateway-fabric/bws
    tag: m4-local
    pullPolicy: Never
  service:
    type: ClusterIP
  pod:
    terminationGracePeriodSeconds: 30
    volumes:
      - name: bws-license
        secret:
          secretName: bws-license
          items:
            - key: bws.lic.txt
              path: bws.lic.txt
  container:
    readinessProbe:
      port: 8081
      path: /readyz
      initialDelaySeconds: 3
    volumeMounts:
      - name: bws-license
        mountPath: /var/run/secrets/bws
        readOnly: true
