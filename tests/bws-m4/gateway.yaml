apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bws-gateway
spec:
  gatewayClassName: bws
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: bws.example.com
    - name: https
      port: 443
      protocol: HTTPS
      hostname: bws.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bws-m4-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe
spec:
  parentRefs:
    - name: bws-gateway
      sectionName: http
    - name: bws-gateway
      sectionName: https
  hostnames:
    - bws.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coffee
          port: 80
