apiVersion: gateway.bessystem.com/v1alpha1
kind: SnippetsPolicy
metadata:
  name: bws-m4-access-log
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bws-gateway
  snippets:
    - context: http
      value: |
        log_format bws_m4 '$remote_addr - $host "$request" $status $body_bytes_sent';
        access_log /dev/stdout bws_m4;
