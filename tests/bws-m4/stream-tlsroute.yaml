apiVersion: apps/v1
kind: Deployment
metadata:
  name: bws-m4-tls-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bws-m4-tls-backend
  template:
    metadata:
      labels:
        app: bws-m4-tls-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: openssl
          image: bws-gateway-fabric/bws:m4-local
          imagePullPolicy: Never
          command:
            - /usr/bin/openssl
          args:
            - s_server
            - -accept
            - "8443"
            - -cert
            - /tls/tls.crt
            - -key
            - /tls/tls.key
            - -www
          ports:
            - name: tls
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: tls
            initialDelaySeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: bws-m4-tls-backend
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: bws-m4-tls-backend
spec:
  selector:
    app: bws-m4-tls-backend
  ports:
    - name: tls
      port: 8443
      targetPort: tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: bws-m4-tls-passthrough
spec:
  parentRefs:
    - name: bws-gateway
      sectionName: tls-passthrough
  hostnames:
    - passthrough.bws.example.com
  rules:
    - backendRefs:
        - name: bws-m4-tls-backend
          port: 8443
