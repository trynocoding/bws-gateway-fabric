bwsGateway:
  lifecycle:
    preStop:
      exec:
        command:
        - /usr/bin/gateway
        - sleep
        - --duration=40s
  terminationGracePeriodSeconds: 50

bws:
  pod:
    terminationGracePeriodSeconds: 50
  container:
    lifecycle:
      preStop:
        exec:
          command:
          - /bin/sleep
          - "40"
