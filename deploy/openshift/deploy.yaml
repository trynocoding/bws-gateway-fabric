apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws-gateway
  namespace: bws-gateway
spec:
  ports:
  - name: agent-grpc
    port: 443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws-gateway
  namespace: bws-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bws-gateway
      app.kubernetes.io/name: bws-gateway
  template:
    metadata:
      annotations:
        prometheus.io/port: "9113"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/instance: bws-gateway
        app.kubernetes.io/name: bws-gateway
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - controller
        - --gateway-ctlr-name=gateway.bessystem.com/bws-gateway-controller
        - --gatewayclass=bws
        - --config=bws-gateway-config
        - --service=bws-gateway
        - --agent-tls-secret=agent-tls
        - --metrics-port=9113
        - --health-port=8081
        - --leader-election-lock-name=bws-gateway-leader-election
        - --product-telemetry-disable
        - --nginx-scc=bws-gateway-scc-nginx
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app.kubernetes.io/instance']
        - name: IMAGE_NAME
          value: bws-gateway-fabric:2.6.7
        image: bws-gateway-fabric:2.6.7
        imagePullPolicy: IfNotPresent
        name: bws-gateway
        ports:
        - containerPort: 8443
          name: agent-grpc
        - containerPort: 9113
          name: metrics
        - containerPort: 8081
          name: health
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/run/secrets/bws-gateway
          name: bws-agent-tls
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
      serviceAccountName: bws-gateway
      terminationGracePeriodSeconds: 30
      volumes:
      - name: bws-agent-tls
        secret:
          secretName: server-tls
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws-gateway-cert-generator
  namespace: bws-gateway
spec:
  template:
    metadata:
      annotations: null
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - generate-certs
        - --service=bws-gateway
        - --cluster-domain=cluster.local
        - --server-tls-secret=server-tls
        - --agent-tls-secret=agent-tls
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: bws-gateway-fabric:2.6.7
        imagePullPolicy: IfNotPresent
        name: cert-generator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
      serviceAccountName: bws-gateway-cert-generator
  ttlSecondsAfterFinished: 30
---
apiVersion: gateway.bessystem.com/v1alpha1
kind: BwsGateway
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws-gateway-config
  namespace: bws-gateway
spec:
  logging:
    level: info
---
apiVersion: gateway.bessystem.com/v1alpha2
kind: BwsProxy
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws-gateway-proxy-config
  namespace: bws-gateway
spec:
  kubernetes:
    deployment:
      container:
        image:
          pullPolicy: IfNotPresent
          repository: bws-gateway-fabric/bws
          tag: 2.6.7
      replicas: 1
    service:
      externalTrafficPolicy: Local
      type: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  labels:
    app.kubernetes.io/instance: bws-gateway
    app.kubernetes.io/name: bws-gateway
    app.kubernetes.io/version: 2.6.7
  name: bws
spec:
  controllerName: gateway.bessystem.com/bws-gateway-controller
  parametersRef:
    group: gateway.bessystem.com
    kind: BwsProxy
    name: bws-gateway-proxy-config
    namespace: bws-gateway
