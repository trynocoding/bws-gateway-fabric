name: Helm Testing

# Note: This workflow currently supports only the BWS data plane image.
# The 'image' input is retained for compatibility with the upstream caller matrix.

on:
  workflow_call:
    inputs:
      image:
        description: 'Data plane image identifier (ignored; BWS is always used)'
        required: true
        type: string
      k8s-version:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ''
      license-secret:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  helm-tests-local:
    name: Helm Tests Local
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist

      - name: Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: BWS Gateway Fabric Docker meta
        id: bws-gateway-meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            name=ghcr.io/trynocoding/bws-gateway-fabric
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=edge
            type=schedule
            type=ref,event=pr
            type=ref,event=branch,suffix=-rc,enable=${{ startsWith(github.ref, 'refs/heads/release') && inputs.tag == '' }}

      - name: BWS data plane Docker meta
        id: bws-meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            name=ghcr.io/trynocoding/bws-gateway-fabric/bws
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=edge
            type=schedule
            type=ref,event=pr
            type=ref,event=branch,suffix=-rc,enable=${{ startsWith(github.ref, 'refs/heads/release') && inputs.tag == '' }}

      - name: Build BWS Gateway Fabric Docker Image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: build/Dockerfile
          tags: ${{ steps.bws-gateway-meta.outputs.tags }}
          context: "."
          target: goreleaser
          load: true
          cache-from: type=gha,scope=bws-gateway
          pull: true

      - name: Build BWS Data Plane Docker Image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: build/Dockerfile.bws
          tags: ${{ steps.bws-meta.outputs.tags }}
          context: "."
          load: true
          cache-from: type=gha,scope=bws-data-plane
          pull: true
          build-args: |
            NJS_DIR=internal/controller/nginx/modules/src
            NGINX_CONF_DIR=internal/controller/nginx/conf
            BUILD_AGENT=gha

      - name: Install cloud-provider-kind
        run: |
          CLOUD_PROVIDER_KIND_VERSION=v0.10.0 # renovate: datasource=github-tags depName=kubernetes-sigs/cloud-provider-kind
          go install sigs.k8s.io/cloud-provider-kind@${CLOUD_PROVIDER_KIND_VERSION}

      - name: Run cloud-provider-kind
        run: $(go env GOPATH)/bin/cloud-provider-kind & > cloud-provider-kind.log 2>&1

      - name: Deploy Kubernetes
        id: k8s
        run: |
          kind create cluster --name ${{ github.run_id }} --image=kindest/node:${{ inputs.k8s-version }}
          kind load docker-image ${{ join(fromJSON(steps.bws-gateway-meta.outputs.json).tags, ' ') }} ${{ join(fromJSON(steps.bws-meta.outputs.json).tags, ' ') }} --name ${{ github.run_id }}
          kubectl kustomize config/crd/gateway-api/standard | kubectl apply -f -
          kubectl create namespace bws-gateway

      - name: Create BWS license secret
        run: |
          echo "placeholder" > bws.lic.txt
          kubectl create secret generic bws-license --from-file bws.lic.txt -n bws-gateway

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install Chart
        run: |
          ct install --config .ct.yaml --namespace bws-gateway --helm-extra-set-args="--set=bwsGateway.image.tag=${{ steps.bws-gateway-meta.outputs.version }} \
          --set=bws.image.repository=ghcr.io/trynocoding/bws-gateway-fabric/bws \
          --set=bws.image.tag=${{ steps.bws-meta.outputs.version }} \
          --set=bwsGateway.image.pullPolicy=Never \
          --set=bws.image.pullPolicy=Never \
          --set=bwsGateway.productTelemetry.enable=false \
          --set=bws.licenseSecretName=bws-license"

  helm-test-remote:
    name: Helm Tests Remote
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install cloud-provider-kind
        run: |
          CLOUD_PROVIDER_KIND_VERSION=v0.10.0 # renovate: datasource=github-tags depName=kubernetes-sigs/cloud-provider-kind
          go install sigs.k8s.io/cloud-provider-kind@${CLOUD_PROVIDER_KIND_VERSION}

      - name: Run cloud-provider-kind
        run: $(go env GOPATH)/bin/cloud-provider-kind & > cloud-provider-kind.log 2>&1

      - name: Deploy Kubernetes
        id: k8s
        run: |
          kind create cluster --name ${{ github.run_id }} --image=kindest/node:${{ inputs.k8s-version }}
          kubectl kustomize config/crd/gateway-api/standard | kubectl apply -f -
          kubectl create namespace bws-gateway

      - name: Create BWS license secret
        run: |
          echo "placeholder" > bws.lic.txt
          kubectl create secret generic bws-license --from-file bws.lic.txt -n bws-gateway

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install Chart
        run: |
          ct install --config .ct.yaml --all --namespace bws-gateway --helm-extra-set-args="--set=bwsGateway.image.tag=nightly \
          --set=bws.image.tag=nightly \
          --set=bwsGateway.productTelemetry.enable=false \
          --set=bws.licenseSecretName=bws-license"
