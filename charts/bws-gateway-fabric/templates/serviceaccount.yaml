apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bws-gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "bws-gateway.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.bwsGateway.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
{{- if or .Values.bwsGateway.serviceAccount.imagePullSecret .Values.bwsGateway.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- if .Values.bwsGateway.serviceAccount.imagePullSecret }}
  - name: {{ .Values.bwsGateway.serviceAccount.imagePullSecret }}
  {{- end }}
  {{- if .Values.bwsGateway.serviceAccount.imagePullSecrets }}
  {{- range .Values.bwsGateway.serviceAccount.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
  {{- end }}
{{- end }}
