# This is the control plane Service for internal communication with the data plane.
# To get a BWS LoadBalancer Service, create a Gateway resource once BWS Gateway Fabric is installed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bws-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bws-gateway.labels" . | nindent 4 }}
{{- if .Values.bwsGateway.service.labels }}
{{ toYaml .Values.bwsGateway.service.labels | indent 4 }}
{{- end }}
{{- if .Values.bwsGateway.service.annotations }}
  annotations:
{{ toYaml .Values.bwsGateway.service.annotations | indent 4 }}
{{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "bws-gateway.selectorLabels" . | nindent 4 }}
  ports:
  - name: agent-grpc
    port: 443
    protocol: TCP
    targetPort: 8443
