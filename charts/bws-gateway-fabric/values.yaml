# yaml-language-server: $schema=values.schema.json

# -- The DNS cluster domain of your Kubernetes cluster.
clusterDomain: cluster.local

# -- The bwsGateway section contains configuration for the BWS Gateway Fabric control plane deployment.
bwsGateway:
  # @schema
  # const: deployment
  # @schema
  # -- The kind of the BWS Gateway Fabric installation - currently, only deployment is supported.
  kind: deployment

  # -- The name of the BWS Gateway Fabric deployment - if not present, then by default uses release name given during installation.
  name: bws-gateway-fabric

  # -- List of namespaces to watch for resources. If not set, all namespaces are watched.
  # The controller's own namespace is always included.
  watchNamespaces: []

  # @schema
  # required: true
  # type: string
  # @schema
  # -- The name of the GatewayClass that will be created as part of this release. Every BWS Gateway
  # Fabric must have a unique corresponding GatewayClass resource. BWS Gateway Fabric only processes resources that
  # belong to its class - i.e. have the "gatewayClassName" field resource equal to the class.
  gatewayClassName: bws

  # -- Set of custom annotations for the BWS Gateway Fabric pods.
  podAnnotations: {}

  # -- Set of labels to be added for BWS Gateway Fabric deployment.
  labels: {}

  # -- Set of custom annotations for GatewayClass objects.
  gatewayClassAnnotations: {}

  # @schema
  # pattern: ^gateway\.bessystem\.com/.*
  # required: true
  # @schema
  # -- The name of the Gateway controller. The controller name must be of the form: DOMAIN/PATH. The controller's domain
  # is gateway.bessystem.com.
  gatewayControllerName: gateway.bessystem.com/bws-gateway-controller

  # The dynamic configuration for the control plane that is contained in the BwsGateway resource.
  config:
    logging:
      # @schema
      # enum:
      #   - info
      #   - debug
      #   - error
      # @schema
      # -- Log level.
      level: info

  # -- Set of custom annotations for BwsGateway objects.
  configAnnotations: {}

  # -- The service configuration for the BWS Gateway Fabric control plane.
  service:
    # -- The annotations of the BWS Gateway Fabric control plane service.
    annotations: {}

    # -- The labels of the BWS Gateway Fabric control plane service.
    labels: {}

  # -- The serviceaccount configuration for the BWS Gateway Fabric control plane.
  serviceAccount:
    # -- Set of custom annotations for the BWS Gateway Fabric control plane service account.
    annotations: {}

    # -- The name of the service account of the BWS Gateway Fabric control plane pods. Used for RBAC.
    # @default -- Autogenerated if not set or set to ""
    name: ""

    # -- The name of the secret containing docker registry credentials for the control plane.
    # Secret must exist in the same namespace as the helm release.
    imagePullSecret: ""

    # -- A list of secret names containing docker registry credentials for the control plane.
    # Secrets must exist in the same namespace as the helm release.
    imagePullSecrets: []

  # -- The number of replicas of the BWS Gateway Fabric Deployment. This value is ignored if autoscaling.enable is true.
  replicas: 1

  # The configuration for leader election.
  leaderElection:
    # -- Enable leader election. Leader election is used to avoid multiple replicas of the BWS Gateway Fabric
    # reporting the status of the Gateway API resources. If not enabled, all replicas of BWS Gateway Fabric
    # will update the statuses of the Gateway API resources.
    enable: true

    # -- The name of the leader election lock. A Lease object with this name will be created in the same Namespace as
    # the controller.
    # @default -- Autogenerated if not set or set to "".
    lockName: ""

  ## Defines the settings for the control plane readiness probe. This probe returns Ready when the controller
  ## has started and is ready to configure NGINX.
  readinessProbe:
    # -- Enable the /readyz endpoint on the control plane.
    enable: true

    # @schema
    # type: integer
    # minimum: 1
    # maximum: 65535
    # @schema
    # -- Port in which the readiness endpoint is exposed.
    port: 8081

    # @schema
    # type: integer
    # minimum: 0
    # @schema
    # -- The number of seconds after the Pod has started before the readiness probes are initiated.
    initialDelaySeconds: 3

    # @schema
    # type: integer
    # minimum: 1
    # @schema
    # -- How often (in seconds) to perform the readiness probe.
    periodSeconds: 10

    # @schema
    # type: integer
    # minimum: 1
    # @schema
    # -- The number of retries after a failed probe before marking the container as Unready.
    failureThreshold: 3

    # @schema
    # type: integer
    # minimum: 1
    # @schema
    # -- Number of seconds after which the probe times out.
    timeoutSeconds: 1

    # @schema
    # type: integer
    # minimum: 1
    # @schema
    # -- Minimum consecutive successes for the probe to be considered successful after having failed.
    successThreshold: 1

  # -- The image configuration for the BWS Gateway Fabric control plane.
  image:
    # -- The BWS Gateway Fabric image to use.
    repository: bws-gateway-fabric
    tag: 2.6.7
    # @schema
    # enum:
    #   - Always
    #   - IfNotPresent
    #   - Never
    # @schema
    pullPolicy: IfNotPresent

  productTelemetry:
    # -- Enable the collection of product telemetry.
    enable: false

  # @schema
  # type: object
  # description: The lifecycle hooks for the bws-gateway container. See https://kubernetes.io/docs/tasks/configure-pod-container/define-lifecycle-hook/
  # @schema
  # -- The lifecycle of the bws-gateway container.
  lifecycle: {}
  # -- Example:
  #   preStop:
  #     exec:
  #       command:
  #         - /bin/sh
  #         - -c
  #         - sleep 10
  #   postStart:
  #     exec:
  #       command:
  #         - /bin/sh
  #         - -c
  #         - echo "Started"

  # -- The resource requests and/or limits of the bws-gateway container.
  resources: {}

  # -- extraVolumes for the BWS Gateway Fabric control plane pod. Use in conjunction with
  # bwsGateway.extraVolumeMounts mount additional volumes to the container.
  extraVolumes: []

  # -- extraVolumeMounts are the additional volume mounts for the bws-gateway container.
  extraVolumeMounts: []

   # -- The priority class name for the BWS Gateway Fabric control plane pod.
  priorityClassName: ""

  # -- The termination grace period of the BWS Gateway Fabric control plane pod.
  terminationGracePeriodSeconds: 30

  # -- Tolerations for the BWS Gateway Fabric control plane pod.
  tolerations: []

  # -- The nodeSelector of the BWS Gateway Fabric control plane pod.
  nodeSelector: {}

  # -- The affinity of the BWS Gateway Fabric control plane pod.
  affinity: {}

  # -- The topology spread constraints for the BWS Gateway Fabric control plane pod.
  topologySpreadConstraints: []

  # -- Autoscaling configuration for the BWS Gateway Fabric control plane.
  autoscaling:
    # -- Enable or disable Horizontal Pod Autoscaler for the control plane.
    enable: false
    # -- Set of custom annotations for the HPA object.
    annotations: {}
    # -- Minimum number of replicas for the BWS data plane HPA.
    minReplicas: 1
    # -- Maximum number of replicas for the BWS data plane HPA.
    maxReplicas: 10
    # -- Target CPU utilization percentage for the BWS data plane HPA. Requires `bws.container.resources` to be set.
    targetCPUUtilizationPercentage: 50
    # -- Target memory utilization percentage for the BWS data plane HPA. Requires `bws.container.resources` to be set. |
    targetMemoryUtilizationPercentage: 50
    # -- The full HPA `spec.behavior` object, passed as-is to the HPA resource. Accepts any valid Kubernetes HPA behavior spec. See the [Kubernetes docs](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior) for all available fields.
    behavior: {}
    #  scaleDown:
    #    stabilizationWindowSeconds: 300
    #    policies:
    #    - type: Pods
    #      value: 1
    #      periodSeconds: 180
    #  scaleUp:
    #    stabilizationWindowSeconds: 300
    #      policies:
    #      - type: Pods
    #        value: 2
    #        periodSeconds: 60
    # -- Custom or additional autoscaling metrics. https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#scaling-on-custom-metrics
    metrics: []
    # - type: Pods
    #   pods:
    #     metric:
    #       name: container_memory_usage_bytes
    #     target:
    #       type: AverageValue
    #       averageValue: "400Mi"
  metrics:
    # -- Enable exposing metrics in the Prometheus format.
    enable: true

    # @schema
    # type: integer
    # minimum: 1
    # maximum: 65535
    # @schema
    # -- Set the port where the Prometheus metrics are exposed.
    port: 9113

    # -- Enable serving metrics via https. By default metrics are served via http.
    # Please note that this endpoint will be secured with a self-signed certificate.
    secure: false

  gwAPIExperimentalFeatures:
    # -- Enable the experimental features of Gateway API which are supported by BWS Gateway Fabric. Requires the Gateway
    # APIs installed from the experimental channel.
    enable: false

  gwAPIInferenceExtension:
    # -- Enable Gateway API Inference Extension support. Allows for configuring InferencePools to route traffic to AI workloads.
    enable: false

    # -- EndpointPicker TLS configuration.
    endpointPicker:
      # -- Disable TLS for EndpointPicker communication. By default, TLS is enabled.
      # Set to true only for development/testing or when using a service mesh for encryption.
      disableTLS: false

      # -- Disables TLS certificate verification when connecting to the EndpointPicker.
      # By default, certificate verification is disabled.
      # REQUIRED: Must be true until Gateway API Inference Extension EndpointPicker supports mounting certificates.
      # See: https://github.com/kubernetes-sigs/gateway-api-inference-extension/issues/1556
      skipVerify: true

  snippets:
    # -- Enable Snippets feature through SnippetsFilter and SnippetsPolicy APIs. SnippetsFilters allow inserting
    # NGINX configuration into the generated NGINX config for HTTPRoute and GRPCRoute resources. SnippetsPolicies
    # allow inserting NGINX configuration into the generated NGINX config for Gateway resources.
    enable: false

  snippetsFilters:
    # -- This flag is deprecated in favor of the snippets.enable flag. The latter will enable snippets for both SnippetsFilters
    # and SnippetsPolicies. Enable SnippetsFilters feature. SnippetsFilters allow inserting NGINX configuration into
    # the generated NGINX config for HTTPRoute and GRPCRoute resources.
    enable: false

# -- The bws section configures BWS data plane deployments.
bws:
  # @schema
  # enum:
  #   - deployment
  #   - daemonSet
  # @schema
  # -- The kind of BWS deployment.
  kind: deployment

  # -- The number of replicas of the BWS Deployment. This value is ignored if autoscaling.enable is true.
  replicas: 1

  # -- Custom patches to apply to the BWS Deployment/DaemonSet.
  patches: []
  # -- Example:
  # - type: StrategicMerge
  #   value:
  #     metadata:
  #       labels:
  #         team: "bws-gateway-fabric"

  # -- Autoscaling configuration for the BWS data plane.
  autoscaling:
    # -- Enable or disable Horizontal Pod Autoscaler for the BWS data plane.
    enable: false
    # -- Set of custom annotations for the HPA object.
    annotations: {}
    # -- Minimum number of replicas for the BWS data plane HPA.
    minReplicas: 1
    # -- Maximum number of replicas for the BWS data plane HPA.
    maxReplicas: 10
    # -- Target CPU utilization percentage for the BWS data plane HPA. Requires `bws.container.resources` to be set.
    targetCPUUtilizationPercentage: 50
    # -- Target memory utilization percentage for the BWS data plane HPA. Requires `bws.container.resources` to be set. |
    targetMemoryUtilizationPercentage: 50
    # -- The full HPA `spec.behavior` object, passed as-is to the HPA resource. Accepts any valid Kubernetes HPA behavior spec. See the [Kubernetes docs](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior) for all available fields.
    behavior: {}
    #  scaleDown:
    #    stabilizationWindowSeconds: 300
    #    policies:
    #    - type: Pods
    #      value: 1
    #      periodSeconds: 180
    #  scaleUp:
    #    stabilizationWindowSeconds: 300
    #      policies:
    #      - type: Pods
    #        value: 2
    #        periodSeconds: 60
    # -- Custom or additional autoscaling metrics. https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#scaling-on-custom-metrics
    metrics: []
    # - type: Pods
    #   pods:
    #     metric:
    #       name: nginx_gateway_fabric_nginx_process_requests_total
    #     target:
    #       type: AverageValue
    #       averageValue: "400Mi"
  image:
    # -- The BWS data plane image to use.
    repository: bws-gateway-fabric/bws
    tag: 2.6.7
    # @schema
    # enum:
    #   - Always
    #   - IfNotPresent
    #   - Never
    # @schema
    pullPolicy: IfNotPresent

  # -- The name of the secret containing docker registry credentials.
  # Secret must exist in the same namespace as the helm release. The control
  # plane will copy this secret into any namespace where BWS is deployed.
  imagePullSecret: ""

  # -- A list of secret names containing docker registry credentials.
  # Secrets must exist in the same namespace as the helm release. The control
  # plane will copy these secrets into any namespace where BWS is deployed.
  imagePullSecrets: []

  # @schema
  # type: object
  # properties:
  #   disableHTTP2:
  #     description: DisableHTTP2 defines if http2 should be disabled for all servers.
  #     type: boolean
  #   disableSNIHostValidation:
  #     description: DisableSNIHostValidation disables the validation that ensures the SNI hostname matches the Host header in HTTPS requests. This resolves HTTP/2 connection coalescing issues with wildcard certificates but introduces security risks as described in Gateway API GEP-3567.
  #     type: boolean
  #   ipFamily:
  #     description: IPFamily specifies the IP family to be used by BWS.
  #     enum:
  #       - ipv4
  #       - ipv6
  #       - dual
  #   rewriteClientIP:
  #     type: object
  #     description: RewriteClientIP defines configuration for rewriting the client IP to the original client's IP.
  #     properties:
  #       mode:
  #         enum:
  #           - ProxyProtocol
  #           - XForwardedFor
  #       setIPRecursively:
  #         type: boolean
  #       trustedAddresses:
  #         type: array
  #         items:
  #           properties:
  #             type:
  #               enum:
  #                 - CIDR
  #                 - IPAddress
  #                 - Hostname
  #             value:
  #               type: string
  #   telemetry:
  #     type: object
