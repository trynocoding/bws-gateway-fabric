  #           interval:
  #             type: string
  #             pattern: ^\d{1,4}(ms|s)?$
  #           batchSize:
  #             type: integer
  #             minimum: 0
  #           batchCount:
  #             type: integer
  #             minimum: 0
  #       serviceName:
  #         type: string
  #         pattern: ^[a-zA-Z0-9_-]+$
  #       spanAttributes:
  #         type: array
  #         items:
  #           properties:
  #             key:
  #               type: string
  #               pattern: ^([^"$\\]|\\[^$])*$
  #               minLength: 1
  #               maxLength: 255
  #             value:
  #               type: string
  #               pattern: ^([^"$\\]|\\[^$])*$
  #               minLength: 1
  #               maxLength: 255
  #       disabledFeatures:
  #         type: array
  #         items:
  #           enum:
  #             - DisableTracing
  #   metrics:
  #     type: object
  #     description: Metrics defines the configuration for Prometheus scraping metrics.
  #     properties:
  #       disable:
  #         type: boolean
  #       port:
  #         type: integer
  #         minimum: 1
  #         maximum: 65535
  #   logging:
  #     type: object
  #     description: Logging defines logging-related settings for BWS.
  #     properties:
  #       errorLevel:
  #         enum:
  #           - debug
  #           - info
  #           - notice
  #           - warn
  #           - error
  #           - crit
  #           - alert
  #           - emerg
  #       agentLevel:
  #         enum:
  #           - debug
  #           - info
  #           - error
  #           - panic
  #           - fatal
  #       accessLog:
  #         type: object
  #         description: AccessLog defines the access log settings.
  #         properties:
  #           disable:
  #             type: boolean
  #             description: Disable turns off access logging when set to true.
  #           escape:
  #             description: Escape specifies how to escape characters in variables for access log. If not specified, 'default' escaping is used.
  #             enum:
  #               - default
  #               - json
  #               - none
  #           format:
  #             type: string
  #             description: Format specifies the custom log format string. If not specified, NGINX default 'combined' format is used.
  #   workerConnections:
  #     type: integer
  #     minimum: 1
  #     maximum: 65535
  #     description: The number of worker connections for BWS. Default is 1024.
  #   dnsResolver:
  #     type: object
  #     description: DNSResolver specifies the DNS resolver configuration for external name resolution. This enables support for routing to ExternalName Services.
  #     properties:
  #       addresses:
  #         type: array
  #         description: List of DNS server addresses. Each address specifies a type and value.
  #         items:
  #           type: object
  #           properties:
  #             type:
  #               enum:
  #                 - IPAddress
  #                 - Hostname
  #               description: Type specifies the type of address.
  #             value:
  #               type: string
  #               minLength: 1
  #               maxLength: 253
  #               description: Value specifies the address value.
  #           required:
  #             - type
  #             - value
  #         minItems: 1
  #         maxItems: 16
  #       timeout:
  #         type: string
  #         description: Timeout specifies the timeout for name resolution.
  #         pattern: ^\d+[smhd]?$
  #       cacheTTL:
  #         type: string
  #         description: CacheTTL specifies how long to cache DNS responses.
  #         pattern: ^\d+[smhd]?$
  #       disableIPv6:
  #         type: boolean
  #         description: DisableIPv6 disables DisableIPv6 lookups. If not specified, or set to false, IPv6 lookups will be enabled.
  #   serverTokens:
  #     type: string
  #     description: Sets the `server_tokens` directive. Accepts 'off', 'on', or 'build' for NGINX OSS, and any string or variable for NGINX Plus.
  # @schema
  # -- The configuration for the data plane that is contained in the BwsProxy resource. This is applied globally to all Gateways
  # managed by this instance of BWS Gateway Fabric.
  config: {}

  # -- The pod configuration for the BWS data plane pod. This is applied globally to all Gateways managed by this
  # instance of BWS Gateway Fabric.
  pod: {}
    # -- The termination grace period of the BWS data plane pod.
    # terminationGracePeriodSeconds: 30

    # -- Tolerations for the BWS data plane pod.
    # tolerations: []

    # -- The nodeSelector of the BWS data plane pod.
    # nodeSelector: {}

    # -- The affinity of the BWS data plane pod.
    # affinity: {}

    # -- The topology spread constraints for the BWS data plane pod.
    # topologySpreadConstraints: []

    # -- The volumes for the BWS data plane pod. Use in conjunction with
    # bws.container.volumeMounts mount additional volumes to the container.
    # volumes: []

  # -- The container configuration for the BWS container. This is applied globally to all Gateways managed by this
  # instance of BWS Gateway Fabric.
  container:
    # @schema
    # type: array
    # items:
    #   type: object
    #   properties:
    #     port:
    #       type: integer
    #       required: true
    #       minimum: 1
    #       maximum: 65535
    #     containerPort:
    #       type: integer
    #       required: true
    #       minimum: 1
    #       maximum: 65535
    # @schema
    # -- A list of HostPorts to expose on the host.
    # This configuration allows containers to bind to a specific port on the host node,
    # enabling external network traffic to reach the container directly through the host's IP address and port.
    # Use this option when you need to expose container ports on the host for direct access,
    # such as for debugging, legacy integrations, or when NodePort/LoadBalancer services are not suitable.
    # Note: Using hostPort may have security and scheduling implications, as it ties pods to specific nodes and ports.
    hostPorts: []
    # - port: 80
    #   containerPort: 80

    # -- The resource requirements of the BWS container. You should set this value if you want to use dataplane Autoscaling(HPA).
    resources: {}

    # @schema
    # type: object
    # description: The lifecycle hooks for the BWS container. See https://kubernetes.io/docs/tasks/configure-pod-container/define-lifecycle-hook/
    # @schema
    # -- The lifecycle of the BWS container.
    lifecycle: {}
    # -- Example:
    #   preStop:
    #     exec:
    #       command:
    #         - /bin/sh
    #         - -c
    #         - sleep 10
    #   postStart:
    #     exec:
    #       command:
    #         - /bin/sh
    #         - -c
    #         - echo "Started"

    # -- volumeMounts are the additional volume mounts for the BWS container.
    volumeMounts: []

    ## -- Defines the settings for the data plane readiness probe. This probe returns Ready when the BWS data plane is ready to serve traffic.
    readinessProbe: {}
      # @schema
      # type: integer
      # minimum: 1
      # maximum: 65535
      # @schema
      # -- Port in which the readiness endpoint is exposed.
      # port: 8081

      # -- The number of seconds after the Pod has started before the readiness probes are initiated.
      # initialDelaySeconds: 3
  # -- The service configuration for the BWS data plane. This is applied globally to all Gateways managed by this
  # instance of BWS Gateway Fabric.
  service:
    # @schema
    # enum:
    #   - ClusterIP
    #   - NodePort
    #   - LoadBalancer
    # @schema
    # -- The type of service to create for the BWS data plane.
    type: LoadBalancer

    # @schema
    # enum:
    #   - Cluster
    #   - Local
    # @schema
    # -- The externalTrafficPolicy of the service. The value Local preserves the client source IP.
    externalTrafficPolicy: Local

    # -- The static IP address for the load balancer. Requires bws.service.type set to LoadBalancer.
    loadBalancerIP: ""

    # -- LoadBalancerClass is the class of the load balancer implementation this Service belongs to.
    # Requires bws.service.type set to LoadBalancer.
    loadBalancerClass: ""

    # -- The IP ranges (CIDR) that are allowed to access the load balancer. Requires bws.service.type set to LoadBalancer.
    loadBalancerSourceRanges: []

    # @schema
    # type: array
    # items:
    #   type: object
    #   properties:
    #     port:
    #       type: integer
    #       required: true
    #       minimum: 1
    #       maximum: 65535
    #     listenerPort:
    #       type: integer
    #       required: true
    #       minimum: 1
    #       maximum: 65535
    # @schema
    # -- A list of NodePorts to expose on the BWS data plane service. Each NodePort MUST map to a Gateway listener port,
    # otherwise it will be ignored. The default NodePort range enforced by Kubernetes is 30000-32767.
    nodePorts: []
    # - port: 30025
    #   listenerPort: 80

    # -- Custom patches to apply to the BWS Service.
    patches: []
    # -- Example:
    #   - type: JSONPatch
    #     value:
    #       - op: replace
    #         path: /spec/sessionAffinity
    #         value: "ClientIP"

# -- The certGenerator section contains the configuration for the cert-generator Job.
certGenerator:
  # -- Enable the cert-generator Job. If this is disabled, then cert-manager or some other method must be used to create the required Secrets.
  enable: true
  # -- The annotations of the cert-generator Job.
  annotations: {}

  # -- The name of the Secret containing TLS CA, certificate, and key for the BWS Gateway Fabric control plane
  # to securely communicate with the BWS Agent. Must exist in the same namespace that the BWS Gateway Fabric
  # control plane is running in (default namespace: bws-gateway).
  serverTLSSecretName: server-tls

  # -- The name of the base Secret containing TLS CA, certificate, and key for the BWS Agent to securely
  # communicate with the BWS Gateway Fabric control plane. Must exist in the same namespace that the
  # BWS Gateway Fabric control plane is running in (default namespace: bws-gateway).
  agentTLSSecretName: agent-tls

  # -- Overwrite existing TLS Secrets on startup.
  overwrite: false

  # -- How long to wait after the cert generator job has finished before it is removed by the job controller.
  ttlSecondsAfterFinished: 30

  # -- Tolerations for the cert-generator pod.
  tolerations: []

  # -- The nodeSelector of the cert-generator pod.
  nodeSelector: {}

  # -- The affinity of the cert-generator pod.
  affinity: {}

  # -- The topology spread constraints for the cert-generator pod.
  topologySpreadConstraints: []

# -- A list of Gateway objects. View https://gateway-api.sigs.k8s.io/reference/spec/#gateway for full Gateway reference.
gateways: []

# Example gateway object:
# name: bws-gateway
# namespace: default
# labels:
#   key: value
# annotations:
#   annotationKey: annotationValue
# spec:
#   gatewayClassName: nginx
#    addresses:
#    - type: IPAddress
#      value: 1.2.3.4
#   infrastructure:
#     annotations:
#       networking.gke.io/load-balancer-type: Internal
#   listeners:
#     - name: https
#       port: 80
#       protocol: HTTPS
#       tls:
#         mode: Terminate
#         certificateRefs:
#           - kind: Secret
#             name: my-secret
#             namespace: certificate
#       allowedRoutes:
#         namespaces:
#           from: Same
#   tls:
#     backend:
#       clientCertificateRef:
#         name: gateway-client-cert
#         kind: Secret

# -- A list of extra Kubernetes manifests to deploy. Each item is a raw YAML string representing a complete
